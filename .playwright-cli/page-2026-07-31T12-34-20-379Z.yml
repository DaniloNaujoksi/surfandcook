    - generic [ref=e28]:
      - generic [ref=e29]:
        - paragraph [ref=e30]: Der Tag
        - heading "Ein Tag, zwei Dinge, die sich lohnen" [level=2] [ref=e31]
        - paragraph [ref=e32]: Der Vormittag gehört dem Wasser, der Nachmittag der Küche. Dazwischen gehen wir zum Steg und schauen, was die Boote gebracht haben — das entscheidet über das Abendessen. Du fährst nach Hause und kannst eine Welle nehmen und ein Ceviche machen. Und du ahnst, warum Peruaner über beides streiten.
      - generic [ref=e33]:
        - generic [ref=e34]:
          - img "Surfstunde im flachen Wasser" [ref=e36]
          - heading "Surfen mit Diego" [level=3] [ref=e37]
          - paragraph [ref=e38]: Zwei Stunden im Wasser, kleine Gruppen, Board und Neopren inklusive. Anfänger stehen auf. Alle anderen arbeiten daran, die Welle zu lesen.
        - generic [ref=e39]:
          - img "Hände bereiten Ceviche auf einem Holztisch zu" [ref=e41]
          - heading "Gemeinsam kochen" [level=3] [ref=e42]
          - paragraph [ref=e43]: Zurück im Haus, selbst Hand anlegen. Limette, Chili, rote Zwiebel, Fisch, der heute Morgen noch geschwommen ist. Keine Vorführung — du schneidest.
        - generic [ref=e44]:
          - img "Gäste an einer langen Tafel bei Sonnenuntergang" [ref=e46]
          - heading "Essen bei Sonnenuntergang" [level=3] [ref=e47]
          - paragraph [ref=e48]: Gegessen wird, was du gemacht hast, an einer langen Tafel, während das Licht über der Landzunge orange wird. Ein Pisco Sour, wenn du magst.
    - generic [ref=e50]:
      - heading "Was dabei ist" [level=2] [ref=e52]
      - generic [ref=e53]:
        - generic [ref=e54]:
          - heading "Kleine Gruppen" [level=3] [ref=e56]
          - paragraph [ref=e57]: Höchstens vier Leute, damit dich wirklich jemand korrigiert.
        - generic [ref=e58]:
          - heading "Board und Neopren" [level=3] [ref=e60]
          - paragraph [ref=e61]: Inklusive. Das Wasser vor Lobitos ist kühler, als es aussieht.
        - generic [ref=e62]:
          - heading "Fotos" [level=3] [ref=e64]
          - paragraph [ref=e65]: Jemand fotografiert, während du surfst. Du bekommst die Dateien, ohne Verkaufsgespräch.
        - generic [ref=e66]:
          - heading "Alles, was du kochst" [level=3] [ref=e68]
          - paragraph [ref=e69]: Zutaten, Getränke und das Essen selbst gehören zum Tag.
    - generic [ref=e71]:
      - img "Surfstunde im flachen Wasser" [ref=e74]
      - generic [ref=e75]:
        - paragraph [ref=e76]: Lobitos
        - heading "Ein Wüstenort, der vom Swell lebt" [level=2] [ref=e77]
        - paragraph [ref=e78]: "Lobitos liegt dort, wo die Sechura-Wüste auf den Pazifik trifft, ein paar Stunden südlich der Grenze zu Ecuador. Früher war es ein Ölort — die Briten ließen Holzhäuser auf Stelzen zurück, die immer noch stehen, ausgeblichen und schief. Dazwischen sind aus Schiffscontainern Küchen, Werkstätten und Zimmer geworden. Viel mehr gibt es hier nicht: Sand, Wind, eine der beständigsten Linken des Kontinents und Leute, die für eine Saison kamen und blieben."
        - link "Wo wir sind" [ref=e79] [cursor=pointer]:
          - /url: /de/unterkunft
